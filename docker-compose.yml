version: '3.8'

services:
  app:
    image: valanse-docker-images
    container_name: spring-app
    ports:
      # Nginx가 같은 호스트에서만 애플리케이션에 접근하도록 제한합니다.
      # 외부 트래픽은 반드시 Nginx의 80/443 포트를 통과해야 합니다.
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - backend-network

  redis:
    image: redis:7.2
    container_name: redis
    # Redis는 backend-network 내부에서만 사용하며 호스트에 포트를 공개하지 않습니다.
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
